name: API CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  api-ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: diploma
          POSTGRES_PASSWORD: diploma
          POSTGRES_DB: diploma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U diploma -d diploma_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://diploma:diploma@127.0.0.1:5432/diploma_test?schema=public

      - name: Push test schema
        working-directory: apps/api
        run: npx prisma db push
        env:
          DATABASE_URL: postgresql://diploma:diploma@127.0.0.1:5432/diploma_test?schema=public

      - name: Lint API
        working-directory: apps/api
        run: npm run lint

      - name: Run unit tests
        working-directory: apps/api
        run: npm run test
        env:
          JWT_SECRET: test-secret

      - name: Run e2e tests
        working-directory: apps/api
        run: npm run test:e2e
        env:
          DATABASE_URL_TEST: postgresql://diploma:diploma@127.0.0.1:5432/diploma_test?schema=public
          JWT_SECRET: test-secret
